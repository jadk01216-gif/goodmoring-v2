name: Auto Changelog & Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-changelog-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Changelog and Update Files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET_FILE="index.html"
          
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(index\.html|LICENSE|manifest\.json|sw\.js)$' || true)
          
          if [ -z "$FILES_CHANGED" ]; then
            echo "指定的 4 個核心檔案皆無修改，跳過日誌生成。"
            exit 0
          fi

          CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' "$TARGET_FILE" || true)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "找不到目前的 appVersion，結束流程。"
            exit 0
          fi

          OLD_VERSION=$(git show HEAD~1:"$TARGET_FILE" | grep -oP 'id="appVersion"\s+data-version="\K[^"]+' || true)
          
          if [ "$CURRENT_VERSION" != "$OLD_VERSION" ] && [ ! -z "$OLD_VERSION" ]; then
            
            touch changelog.md

            if grep -q "# 🚀 更新日誌：版本 $CURRENT_VERSION" changelog.md; then
              echo "changelog.md 中已存在此版本，跳過。"
              exit 0
            fi

            if [ -f "README.md" ]; then
              echo "正在自動將 README.md 中的版本更新為 $CURRENT_VERSION..."
              sed -i -E "s/## 🌅 早安圖製作工具[[:space:]]+版本[[:space:]]+v[0-9\.]+/## 🌅 早安圖製作工具 版本 $CURRENT_VERSION/g" README.md
            fi

            echo "版本已變更，正在擷取程式碼實際變更（Git Diff）..."

            GIT_DIFF_OUTPUT=$(git diff HEAD~1 HEAD -- index.html LICENSE manifest.json sw.js | head -n 200)
            
            PROMPT="你是一個專業的開源軟體日誌生成助手。請根據以下這段程式碼的實際變更內容（Git Diff，其中 + 代表新增，- 代表刪除），推斷、整理並直接輸出繁體中文的更新日誌重點。
            
            程式碼變更內容 (Git Diff)：
            $GIT_DIFF_OUTPUT
            
            你的任務：
            請直接以 Markdown 的條列式符號（*）列出這次版本最主要、有意義的變更點即可。
            請勿自己加上額外的「### 功能分類」標題，也不要加上任何前言、後語、問候語或外層 Markdown 大標題，直接輸出更新項目。"

            JSON_PROMPT=$(NODE_OPTIONS="--no-warnings" node -e 'console.log(JSON.stringify(process.argv[1]))' -- "$PROMPT")

            echo "正在呼叫 Google Gemma API..."
            API_RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemma2-27b-it:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d "{\"contents\": [{\"parts\": [{\"text\": $JSON_PROMPT}]}]}")

            AI_CONTENT=$(echo "$API_RESPONSE" | node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(0, "utf-8"));
              if(data.candidates && data.candidates[0].content.parts[0].text) {
                console.log(data.candidates[0].content.parts[0].text);
              } else {
                console.log("* 優化內部程式碼結構與穩定性。");
              }
            ')

            NOW_DATE=$(TZ="Asia/Taipei" date +'%Y/%-m/%-d %H:%M')
            
            mv changelog.md old_changelog.tmp 2>/dev/null || touch old_changelog.tmp
            
            echo "# 🚀 更新日誌：版本 $CURRENT_VERSION" > changelog.md
            echo "" >> changelog.md
            echo "### 感謝您持續使用本產品！我們很高興向您宣佈 $CURRENT_VERSION 版本的更新。" >> changelog.md
            echo "" >> changelog.md
            echo "$AI_CONTENT" >> changelog.md
            echo "" >> changelog.md
            echo '<div align="right">' >> changelog.md
            echo "    早安圖製作工具作者於 $NOW_DATE 發布" >> changelog.md
            echo "</div>" >> changelog.md
            echo "" >> changelog.md
            echo "---" >> changelog.md
            echo "" >> changelog.md
            
            cat old_changelog.tmp >> changelog.md
            rm -f old_changelog.tmp
            echo "changelog.md 最新版本已成功置頂寫入！"
            
          else
            echo "雖然檔案有變更，但版本號未改變（仍為 $CURRENT_VERSION），跳過日誌生成。"
          fi

      - name: Commit and Push changes
        run: |
          if git diff --name-only | grep -qE '^(changelog\.md|README\.md)$'; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add changelog.md README.md
            CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' index.html)
            git commit -m "chore: 更新版本 $CURRENT_VERSION [skip ci]"
            git push
          else
            echo "沒有變更需要提交。"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (Attempt 1)
        id: deploy_1
        uses: actions/deploy-pages@v4
        timeout-minutes: 2
        continue-on-error: true

      - name: Wait for server recovery if Attempt 1 failed
        if: steps.deploy_1.outcome == 'failure'
        run: |
          echo "⚠️ 第一輪部署因 GitHub 伺服器忙碌而失敗或逾時。"
          echo "⏳ 正在等待 20 秒讓伺服器稍微消化快取，隨後將自動進行重試..."
          sleep 20

      - name: Deploy to GitHub Pages (Attempt 2 - Retry)
        if: steps.deploy_1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 3