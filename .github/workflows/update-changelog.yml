name: Auto Changelog & Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-changelog-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Changelog and Update Files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET_FILE="index.html"
          
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(index\.html|LICENSE|manifest\.json|sw\.js)$' || true)
          
          if [ -z "$FILES_CHANGED" ]; then
            echo "指定的 4 個核心檔案皆無修改，跳過日誌生成。"
            exit 0
          fi

          CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' "$TARGET_FILE" || true)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "找不到目前的 appVersion，結束流程。"
            exit 0
          fi

          OLD_VERSION=$(git show HEAD~1:"$TARGET_FILE" | grep -oP 'id="appVersion"\s+data-version="\K[^"]+' || true)
          
          if [ "$CURRENT_VERSION" != "$OLD_VERSION" ] && [ ! -z "$OLD_VERSION" ]; then
            
            touch changelog.md

            if grep -q "# 🚀 更新日誌：版本 $CURRENT_VERSION" changelog.md; then
              echo "changelog.md 中已存在此版本，跳過。"
              exit 0
            fi

            if [ -f "README.md" ]; then
              echo "正在自動將 README.md 中的版本更新為 $CURRENT_VERSION..."
              sed -i -E "s/## 🌅 早安圖製作工具[[:space:]]+版本[[:space:]]+v[0-9\.]+/## 🌅 早安圖製作工具 版本 $CURRENT_VERSION/g" README.md[cite: 1]
            fi

            echo "版本已變更，正在擷取程式碼實際變更（Git Diff）..."

            # 限制 200 行防 Token 爆炸
            GIT_DIFF_OUTPUT=$(git diff HEAD~1 HEAD -- index.html LICENSE manifest.json sw.js | head -n 200)
            
            PROMPT="你是一個專業的開源軟體日誌生成助手。請根據以下這段程式碼的實際變更內容（Git Diff，其中 + 代表新增，- 代表刪除），推斷並整理出繁體中文的更新日誌細項。
            
            程式碼變更內容 (Git Diff)：
            $GIT_DIFF_OUTPUT
            
            你的任務是挑選出有意義的變更，並嚴格分為以下三類輸出（如果某類別沒有內容，請寫「* 無」）：
            
            ### ✨ 功能更新
            * [這裡寫新增的功能，若無則寫 * 無]
            
            ### 🐛 Bug 修復
            * [這裡寫修復的錯誤，若無則寫 * 無]
            
            ### 🎨 排版變更
            * [這裡寫介面或排版調整，若無則寫 * 無]
            
            注意：請直接且只輸出上述三個標題和底下的條列項目即可，不要加上任何其他的前言、後語、問候語或外層 Markdown 標題。"

            JSON_PROMPT=$(NODE_OPTIONS="--no-warnings" node -e 'console.log(JSON.stringify(process.argv[1]))' -- "$PROMPT")

            echo "正在呼叫 Google Gemma API..."
            API_RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemma2-27b-it:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d "{\"contents\": [{\"parts\": [{\"text\": $JSON_PROMPT}]}]}")

            AI_CONTENT=$(echo "$API_RESPONSE" | node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(0, "utf-8"));
              if(data.candidates && data.candidates[0].content.parts[0].text) {
                console.log(data.candidates[0].content.parts[0].text);
              } else {
                console.log("### ✨ 功能更新\n\n* 無\n\n### 🐛 Bug 修復\n\n* 無\n\n### 🎨 排版變更\n\n* 無");
              }
            ')

            NOW_DATE=$(TZ="Asia/Taipei" date +'%Y/%m/%d %H:%M' | awk -F'/' '{printf "%s/%d/%d", $1, $2, $3}' | awk '{printf "%s %s\n", $1, $2}')
            
            mv changelog.md old_changelog.tmp 2>/dev/null || touch old_changelog.tmp
            
            echo "# 🚀 更新日誌：版本 $CURRENT_VERSION" > changelog.md
            echo "" >> changelog.md
            echo "### 感謝您持續使用本產品！我們很高興向您宣佈 $CURRENT_VERSION 版本的更新。" >> changelog.md
            echo "" >> changelog.md
            echo "$AI_CONTENT" >> changelog.md
            echo "" >> changelog.md
            echo '<div align="right">' >> changelog.md
            echo "    早安圖製作工具作者於 $NOW_DATE 發布" >> changelog.md
            echo "</div>" >> changelog.md
            echo "" >> changelog.md
            echo "---" >> changelog.md
            echo "" >> changelog.md
            
            cat old_changelog.tmp >> changelog.md
            rm -f old_changelog.tmp
            echo "changelog.md 最新版本已成功置頂寫入！"
            
          else
            echo "雖然檔案有變更，但版本號未改變（仍為 $CURRENT_VERSION），跳過日誌生成。"
          fi

      - name: Commit and Push changes
        run: |
          if git diff --name-only | grep -qE '^(changelog\.md|README\.md)$'; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add changelog.md README.md
            CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' index.html)
            git commit -m "chore: 更新版本 $CURRENT_VERSION [skip ci]"
            git push
          else
            echo "沒有變更需要提交。"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # -----------------------------------------------------------------
      # 【優化處】：加上自動重試機制，若部署失敗會自動等待 10 秒並重試，最高 3 次
      # -----------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true # 防止伺服器抽風導致整個工作流卡死報錯

      - name: Retry Deployment if Failed
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "偵測到 GitHub Pages 伺服器未回應或部署失敗，開啟自動重設與重試機制..."
          for i in {1..3}; do
            echo "正在進行第 $i 次重新部署嘗試（等待 10 秒）..."
            sleep 10
            # 手動觸發再次呼叫，成功就退出迴圈
            if gh api -X POST /repos/${{ github.repository }}/pages/deployments -f artifact_id=${{ steps.deployment.outputs.artifact_id || '8062732801' }}; then
              echo "重新部署成功！"
              exit 0
            fi
          done
          echo "已重試 3 次皆失敗，可能為 GitHub 伺服器當機，請稍後手動重試。"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}