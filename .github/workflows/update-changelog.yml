name: Auto Changelog & Deploy Pages

on:
  push:
    branches:
      - main # 如果您的預設分支是 master，請改為 master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # 僅取得最近 2 次提交以精準比對本次變更

      - name: Generate Changelog and Update Files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TARGET_FILE="index.html"
          
          # 1. 核心修正：移除 README.md，只偵測這 4 個檔案是否有被修改
          FILES_CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(index\.html|LICENSE|manifest\.json|sw\.js)$' || true)
          
          if [ -z "$FILES_CHANGED" ]; then
            echo "指定的 4 個核心檔案皆無修改，跳過日誌生成與部署。"
            exit 0
          fi

          # 2. 抓取目前與上一個版本的版本號
          CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' "$TARGET_FILE" || true)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "找不到目前的 appVersion，結束流程。"
            exit 0
          fi

          OLD_VERSION=$(git show HEAD~1:"$TARGET_FILE" | grep -oP 'id="appVersion"\s+data-version="\K[^"]+' || true)
          
          # 3. 同時滿足「4檔其一有改」+「版本號有變」雙重檢查機制
          if [ "$CURRENT_VERSION" != "$OLD_VERSION" ] && [ ! -z "$OLD_VERSION" ]; then
            
            # 建立空的 changelog.md 避免後續檢查出錯
            touch changelog.md

            # 檢查舊的 changelog 標題，避免重複寫入
            if grep -q "# 🚀 更新日誌：版本 $CURRENT_VERSION" changelog.md; then
              echo "changelog.md 中已存在此版本，跳過。"
              exit 0
            fi

            # 4. 自動修改 README.md 中的版本標題（不用 AI 處理，防止無限循環）
            if [ -f "README.md" ]; then
              echo "正在自動將 README.md 中的版本從 $OLD_VERSION 更新為 $CURRENT_VERSION..."
              # 使用 sed 將舊版本號改為新版本號
              sed -i "s/## 🌅 早安圖製作工具 版本 $OLD_VERSION/## 🌅 早安圖製作工具 版本 $CURRENT_VERSION/g" README.md
            fi

            echo "版本已變更，正在擷取程式碼實際變更（Git Diff）..."

            # 5. 僅撈取這 4 個檔案的實際程式碼變更內容（限制前 200 行防 Token 爆炸）
            GIT_DIFF_OUTPUT=$(git diff HEAD~1 HEAD -- index.html LICENSE manifest.json sw.js | head -n 200)
            
            # 6. 設計給 Gemma 的 Prompt，讓它僅看程式碼差值寫日誌
            PROMPT="你是一個專業的開源軟體日誌生成助手。請根據以下這段程式碼的實際變更內容（Git Diff，其中 + 代表新增，- 代表刪除），推斷並整理出繁體中文的更新日誌細項。
            
            程式碼變更內容 (Git Diff)：
            $GIT_DIFF_OUTPUT
            
            你的任務是挑選出有意義的變更，並嚴格分為以下三類輸出（如果某類別沒有內容，請寫「* 無」）：
            
            ### ✨ 功能更新
            * [這裡寫新增的功能，若無則寫 * 無]
            
            ### 🐛 Bug 修復
            * [這裡寫修復的錯誤，若無則寫 * 無]
            
            ### 🎨 排版變更
            * [這裡寫介面或排版調整，若無則寫 * 無]
            
            注意：請直接且只輸出上述三個標題和底下的條列項目即可，不要加上任何其他的前言、後語、問候語或外層 Markdown 標題。"

            JSON_PROMPT=$(NODE_OPTIONS="--no-warnings" node -e 'echo(JSON.stringify(process.argv[1]))' -- "$PROMPT")

            # 7. 安全呼叫 Google Gemma API
            echo "正在呼叫 Google Gemma API..."
            API_RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemma2-27b-it:generateContent" \
              -H "Content-Type: application/json" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -d "{\"contents\": [{\"parts\": [{\"text\": $JSON_PROMPT}]}]}")

            AI_CONTENT=$(echo "$API_RESPONSE" | node -e '
              const fs = require("fs");
              const data = JSON.parse(fs.readFileSync(0, "utf-8"));
              if(data.candidates && data.candidates[0].content.parts[0].text) {
                console.log(data.candidates[0].content.parts[0].text);
              } else {
                console.log("### ✨ 功能更新\n\n* 無\n\n### 🐛 Bug 修復\n\n* 無\n\n### 🎨 排版變更\n\n* 無");
              }
            ')

            # 8. 格式化目前台北時間
            NOW_DATE=$(TZ="Asia/Taipei" date +'%Y/%m/%d %H:%M' | awk -F'/' '{printf "%s/%d/%d", $1, $2, $3}' | awk '{printf "%s %s\n", $1, $2}')
            
            # 建立本次新版本的獨立日誌模板
            NEW_ENTRY="# 🚀 更新日誌：版本 $CURRENT_VERSION

### 感謝您持續使用本產品！我們很高興向您宣佈 $CURRENT_VERSION 版本的更新。

$AI_CONTENT

<div align=\"right\">
    早安圖製作工具作者於 $NOW_DATE 發布
</div>

---

"
            # 9. 將新內容置頂附加到 changelog.md 最上方
            mv changelog.md old_changelog.tmp 2>/dev/null || touch old_changelog.tmp
            printf "$NEW_ENTRY" > changelog.md
            cat old_changelog.tmp >> changelog.md
            rm -f old_changelog.tmp
            echo "changelog.md 最新版本已成功置頂寫入！"
            
          else
            echo "雖然檔案有變更，但版本號未改變（仍為 $CURRENT_VERSION），跳過日誌生成。"
          fi

      - name: Commit and Push changes
        run: |
          # 檢查 changelog.md 或 README.md 是否有被修改
          if git diff --name-only | grep -qE '^(changelog\.md|README\.md)$'; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add changelog.md README.md
            CURRENT_VERSION=$(grep -oP 'id="appVersion"\s+data-version="\K[^"]+' index.html)
            git commit -m "chore: auto update changelog.md & README.md for version $CURRENT_VERSION"
            git push
          else
            echo "沒有變更需要提交。"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-changelog
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4